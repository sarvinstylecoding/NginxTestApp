
server {
        listen 80;
        server_name sarvinstylecoding.com www.sarvinstylecoding.com;
        location / {
                proxy_pass http://web:3000;
        }
        location /api/ {
                proxy_pass http://api:3001/;
        }
        location /mongo/ {
                proxy_pass http://mongoExpress:8081;
        }

}