server {
        listen 80;
        server_name sarvinstylecoding.com www.sarvinstylecoding.com;
        return 301 https://$host$request_uri; 

}
server {
        listen 443 ssl;
        server_name sarvinstylecoding.com www.sarvinstylecoding.com;
        
        ssl_certificate /etc/letsencrypt/live/sarvinstylecoding.com/fullchain.pem; 
        ssl_certificate_key /etc/letsencrypt/live/sarvinstylecoding.com/privkey.pem;


        location / {
                proxy_pass http://web:3000;
        }
        location /api/ {
                proxy_pass http://server api:3001;                                
                proxy_cache my_cache;
                proxy_cache_methods GET HEAD;
                proxy_cache_valid 200 60s;
                add_header X-Cache-Status $upstream_cache_status;
        }
        location /mongo/ {
                proxy_pass http://mongoExpress:8081;
        }

}

