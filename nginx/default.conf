proxy_cache_path /data/nginx/cache 
                keys_zone=api_cache:10m
                max_size=1g
                inactive=30m
                use_temp_path=off;

server {
        listen 80;
        server_name sarvinstylecoding.com www.sarvinstylecoding.com;
        return 301 https://$host$request_uri; 

}
server {
        listen 443 ssl;
        server_name sarvinstylecoding.com www.sarvinstylecoding.com;
        
        ssl_certificate /etc/letsencrypt/live/sarvinstylecoding.com/fullchain.pem; 
        ssl_certificate_key /etc/letsencrypt/live/sarvinstylecoding.com/privkey.pem;


        location / {
                proxy_pass http://web:3000;
        }
        # Cache
        location = /api/proccessData {
                proxy_cache api_cache;
                proxy_cache_valid 200 10m;
                proxy_pass http://api:3001/;
        } 
        # no Cache       
        location = /api/users {
                proxy_pass http://api:3001/;
        }
        location /mongo/ {
                proxy_pass http://mongoExpress:8081;
        }

}

