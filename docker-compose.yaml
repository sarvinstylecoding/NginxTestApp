services:
  web:
    build:
      context: frontend
    environment:
      - REACT_APP_API_URL=/api  
    expose:
      - 3000
  api:
    build:
      context: backend
    expose:
      - 3001
    environment:
      - API_NAME=api1
      - DB_URL=mongodb://admin:pass123@db:27017/?authSource=admin
    restart: always
    depends_on:
      - db
    command: ["node", "index.js"]
  api2:
    build:
      context: backend
    expose:
      - 3001
    environment:
      - API_NAME=api2
      - DB_URL=mongodb://admin:pass123@db:27017/?authSource=admin
    restart: always
    depends_on:
      - db
    command: ["node", "index.js"]
  api3:
    build:
      context: backend
    expose:
      - 3001
    environment:
      - API_NAME=api3
      - DB_URL=mongodb://admin:pass123@db:27017/?authSource=admin
    restart: always
    depends_on:
      - db
    command: ["node", "index.js"]

  db:
    image: mongo:4.4
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pass123
    volumes:
      - mongodb-sarvin:/data/db
  mongoExpress:
    image: mongo-express
    expose:
      - 8081
    environment:
      - ME_CONFIG_SITE_BASEURL=/mongo/
      - ME_CONFIG_BASICAUTH_USERNAME=sarvin
      - ME_CONFIG_BASICAUTH_PASSWORD=sarvinpass
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=pass123
      - ME_CONFIG_MONGODB_SERVER=db
    depends_on:
      - db
  nginx:
    image: nginx:1.30.4-alpine3.24
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro 
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
volumes:
  mongodb-sarvin:




